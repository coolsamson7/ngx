<div class="detail-container" *ngIf="feature; else empty">
    <div class="header">
        <div class="type-label">FEATURE COMPONENT</div>
        <h1>{{ feature.label }}</h1>
        <code class="id-str">{{ feature.id }}</code>
    </div>

    <div class="code-viewport">
        <pre><code [prismHighlight]="serialized" language="json"></code></pre>
    </div>
</div>

<ng-template #empty>
    <div class="empty-placeholder">
        <p>Select a node to view the registry definition</p>
    </div>
</ng-template>
