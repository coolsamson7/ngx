<div class="detail-container" *ngIf="feature; else empty">
    <header class="header">
        <div class="eyebrow">FEATURE SPECIFICATION</div>
        <h1>{{ feature.label }}</h1>
        <code class="id-line">{{ feature.id }}</code>
    </header>

    <div class="code-viewport">
        <pre><code [prismHighlight]="serialized" language="json"></code></pre>
    </div>
</div>

<ng-template #empty>
    <div class="empty-state">
        <p>Select a node from the registry to inspect its metadata</p>
    </div>
</ng-template>
