<div class="browser-container">
    <aside class="tree-sidebar">
        <div class="sidebar-header">Registry Explorer</div>
        <div class="scroll-area">
            <feature-node
                    *ngFor="let f of roots; trackBy: trackById"
                    [feature]="f"
                    [selected]="selected"
                    [onSelect]="selectFn">
            </feature-node>
        </div>
    </aside>

    <mat-divider vertical></mat-divider>

    <main class="detail-view">
        <feature-detail-panel [feature]="selected"></feature-detail-panel>
    </main>
</div>
