
<button mat-button
        #btn="matRipple"
        matRipple

        class="pct-btn"
        [class.pct-btn-top]="iconPosition === 'top'"
        [class.pct-btn-left]="iconPosition === 'left'"
        [disabled]="!command.enabled"
        [matTooltip]="tooltip"
        matTooltipPosition="below"
        (click)="command.run()">

    <div class="pct-btn-body">
        <div class="pct-btn-stack">
            <svg-icon *ngIf="command.icon && iconPosition !== 'none'"
                      [name]="command.icon" class="pct-icon"></svg-icon>
            <span *ngIf="labelMode === 'show'" class="pct-label">{{ command.label }}</span>
        </div>
    </div>
</button>
