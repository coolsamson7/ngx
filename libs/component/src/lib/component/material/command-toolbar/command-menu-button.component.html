<button mat-button
        class="pct-btn pct-menu-trigger"
        [class.pct-btn-top]="iconPosition === 'top'"
        [class.pct-btn-left]="iconPosition === 'left'"
        [matMenuTriggerFor]="menu"
        [matTooltip]="tooltip"
        matTooltipPosition="below">

    <div class="pct-btn-body">
        <div class="pct-btn-stack">
            <svg-icon *ngIf="icon && iconPosition !== 'none'"
                      [name]="icon" class="pct-icon"></svg-icon>
            <span *ngIf="labelMode === 'show'" class="pct-label">{{ label }}</span>
        </div>
        <mat-icon class="pct-arrow">arrow_drop_down</mat-icon>
    </div>
</button>

<mat-menu #menu="matMenu" class="pct-dropdown-panel">
    <button mat-menu-item
            *ngFor="let cmd of commands"
            [disabled]="!cmd.enabled"
            (click)="cmd.run()">
        <svg-icon *ngIf="cmd.icon" [name]="cmd.icon" class="pct-menu-icon"></svg-icon>
        <span class="pct-menu-label">{{ cmd.label }}</span>
        <span *ngIf="cmd.shortcut" class="pct-menu-shortcut">{{ cmd.shortcut }}</span>
    </button>
</mat-menu>
